[package]
name = "danplay-analisis"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "El análisis de DanPlay: el pulso y el «1» (Beat This!), separar en pistas (Demucs, el Mega53), el clic de la mezcla y los pesos de los modelos"

[lib]
name = "analisis"

[dependencies]
# El sonido del clic: el mismo que suena en el modo estudio (sin el motor
# entero: solo lo que comparte con la app de escritorio).
danplay-motor = { path = "../motor", default-features = false }
# Lo que dijo la red se guarda en float16, como lo guardaba numpy.
half = "2.7"
# Las redes (Beat This!, las voces) en ONNX Runtime. La biblioteca se carga
# al usarla (`load-dynamic`), no se enlaza: así compila en todas partes,
# también en los Mac Intel, para los que ort no trae ONNX Runtime hecho, y
# usa el mismo que Python (el de su paquete `onnxruntime`: la 1.30, o la
# 1.23.2 en los Mac Intel, la última que hay para ellos; por eso el API 23).
# La rc.13 es la última de ort con más de dos semanas.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-23"] }
# El espectrograma: la FFT de cada trama (sobre rustfft, el del motor).
realfft = "3.5"
# El trabajo del separador, sus manifiestos y la cabecera de un .safetensors
# llegan en JSON; la configuración de las voces y sus estilos, con los
# decimales exactos, como json.loads.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# La clave de cada archivo en la caché del pulso (como hashlib.sha1).
sha1 = "0.11"
# El texto de Supertonic en NFKD, como unicodedata.
unicode-normalization = "0.1.26"
# Los checkpoints de PyTorch y lo que dijo la red de cada canción (.npz) son
# zips: los mismos rasgos que el del motor, para no compilar otro.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
