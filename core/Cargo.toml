[package]
name = "danplay_core"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "danplay_core"
crate-type = ["cdylib"]

[dependencies]
# `extension-module` no va aqui: pyo3 lo da por obsoleto y maturin (>= 1.9.4)
# ya compila el modulo como extension por su cuenta. Repetido aqui iba
# tambien a `cargo test`; ahora las pruebas enlazan con libpython, o se
# lanzan con PYO3_BUILD_EXTENSION_MODULE=1 como hace maturin.
pyo3 = "0.29"
rayon = "1.10"
# las etiquetas de cada canción (lofty), las mismas que usará la app
danplay-library = { path = "../library" }
# el análisis: el pulso (Beat This!), el clic de la mezcla, los pesos
danplay-analysis = { path = "../analysis" }
# los arrays de numpy que van y vienen (el espectrograma, lo que dice la red)
numpy = "0.29"

[dev-dependencies]
# las pruebas comparan los hashes con el md5 de siempre
md-5 = "0.11"

[lints]
workspace = true
