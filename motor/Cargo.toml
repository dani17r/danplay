[package]
name = "danplay-motor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "El motor de pistas de la app del celular: las partes de una cancion, cada una con su volumen, con velocidad, tono, tramos y clic"

[features]
default = ["motor"]
# Todo el motor: abrir el .danpista, decodificar, mezclar, estirar y sonar.
# Sin ella queda lo que comparte con la app de escritorio (el pulso y su
# rejilla, el metronomo, la cola y el sonido del clic): asi la PC y el
# celular hacen y cuentan lo mismo, y la PC no compila nada del resto.
motor = ["dep:symphonia", "dep:cpal", "dep:rtrb", "dep:zip", "dep:cc"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# `origin` del estado de la cola: lo que la interfaz pasa, opaco.
serde_json = "1"
# El pulso de una cancion: la envolvente de ataques sale de una FFT por trama.
rustfft = "6.2"
# Solo Vorbis (lo que lleva el .danpista) y MP3 (si el ffmpeg de la PC no
# sabia hacer Vorbis): los dos empiezan en la muestra exacta. Medido:
# AAC llega 1024 muestras tarde con symphonia, y el clic se iria.
symphonia = { version = "0.6", optional = true, default-features = false, features = ["ogg", "vorbis", "mp3"] }
cpal = { version = "0.17", optional = true }
rtrb = { version = "0.4", optional = true }
zip = { version = "8", optional = true, default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
cc = { version = "1", optional = true }

[lints]
workspace = true

[dev-dependencies]
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
