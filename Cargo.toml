# Los crates de Rust de DanPlay, en un solo workspace:
#
#   analysis/           el analisis: el pulso y el «1» (Beat This!), separar
#                       en pistas (Demucs, el Mega53), en ONNX Runtime; el clic
#                       de la mezcla y los pesos de los modelos
#   core/               el modulo PyO3 del nucleo (hashes en paralelo, forma de onda)
#   desktop/src-tauri/  la app de escritorio (Tauri): cola, audio, bandeja, MPRIS
#   engine/             el motor de pistas de la app del celular (y lo que
#                       comparte con la de escritorio: el pulso, el
#                       metronomo, la cola y el sonido del clic)
#   mobile/             la app del celular (Tauri, Android e iOS)
#
# Un solo Cargo.lock (las dependencias que comparten van a la misma version),
# una sola carpeta target/ en la raiz, `cargo test --workspace` para todo, y la
# version de DanPlay en un solo sitio: la de aqui abajo, que heredan todos los
# crates, que Tauri usa para la app y que `scripts/bump-version.sh` cambia.
[workspace]
members = ["analysis", "core", "desktop/src-tauri", "engine", "library", "mobile"]
resolver = "3"

[workspace.package]
version = "1.30.0"
edition = "2024"
# DanPlay es obra de Daniel Rangel (https://t.me/Dani17r)
authors = ["Daniel Rangel"]
# Uno para los dos: Cargo resuelve el Cargo.lock con el mas bajo de los
# miembros, y con 1.85 en el nucleo se quedaba en tauri 2.11 aunque la app
# pudiera con 2.12 (que pide 1.90), y la interfaz ya iba con la 2.12.
# Lo que pide cada cosa: tauri 2.12, 1.90; notify-rust (las notificaciones
# de Linux), 1.89; symphonia 0.6, md-5 0.11 y la edicion 2024, 1.85.
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Ruido aqui: el audio y los hashes convierten todo el rato entre muestras,
# tamaños, segundos y frecuencias, a proposito y sabiendo el rango de cada cosa.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
# Los comandos de Tauri y las funciones de PyO3 reciben por valor lo que
# deserializa (o convierte) su marco.
needless_pass_by_value = "allow"
# Los errores son `String` en castellano y ya dicen lo que pasa.
missing_errors_doc = "allow"
must_use_candidate = "allow"
# Los comentarios hablan de MPRIS, PyO3 o D-Bus sin comillas de codigo.
doc_markdown = "allow"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
print_stderr = "warn"

# Los perfiles solo cuentan en la raiz de un workspace (en los crates se
# ignoran). LTO «thin» y el codigo en varios trozos, y no el LTO completo en
# uno solo: aquel optimizaba el programa entero de una vez y en un hilo, y era
# lo que mas tardaba de cada paquete (7:40 de Rust en el de Windows de la
# 1.30, y lo mismo en cada destino de Android). El thin reparte ese trabajo
# entre los nucleos y sigue optimizando entre crates; el motor de audio va
# sobrado igual (el peor trozo de 11,6 ms se hace en 0,34).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
# Sin `panic = "abort"`: el hilo de audio decodifica archivos de fuera, y un
# mp3 corrupto que hiciera panic tumbaba la aplicacion entera. Desenrollando,
# el hilo se cae solo y se puede levantar otra vez. (Y PyO3 convierte un
# panic en una excepcion de Python, cosa que con abort no podria.)
panic = "unwind"
