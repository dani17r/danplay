[package]
name = "danplay-biblioteca"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "biblioteca"

[dependencies]
fancy-regex = "0.19.2"
# Leer y escribir las etiquetas (ID3, Vorbis, MP4): MIT o Apache-2.0. Es lo
# que sustituye a mutagen, que es GPL.
lofty = "0.25"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Los datos de fuera: el JSON que Ultimate Guitar lleva dentro de su página.
serde_json = "1.0.154"
unicode-normalization = "0.1.26"
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
# Pedir páginas (cifrados, la búsqueda en la web) cuando el núcleo entero
# esté en Rust: síncrono y con rustls, sin OpenSSL ni un runtime async.
ureq = "3.5.0"

[lints]
workspace = true
