[package]
name = "danplay-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "La API del núcleo de DanPlay: sus rutas, cuerpos y errores, en el mismo proceso que la app o por un socket"

[lib]
name = "server"

[[bin]]
name = "danplay-server"
path = "src/main.rs"
required-features = ["serve"]

[features]
# Servir la API por un socket (`serve` y el binario `danplay-server`): las
# pruebas de la interfaz y la línea de órdenes. La app de escritorio lleva el
# núcleo dentro y no lo usa: lo pide sin él (`default-features = false`) y no
# carga con hyper ni con lo de tokio que solo sirve para eso.
default = ["serve"]
serve = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:bytes", "dep:tokio"]

[dependencies]
# Lo que hace el núcleo con la música (el índice, las listas, las etiquetas...)
danplay-library = { path = "../library" }
# El pulso, el separador y el clic (para las rutas que los usen)
danplay-analysis = { path = "../analysis" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
log = "0.4"
# La consulta de la URL, como `parse_qsl` de Python
form_urlencoded = "1"
# El `etag` del audio, como el de Starlette (md5 de la fecha y el tamaño)
md-5 = "0.11.0"
# La red de enriquecer una canción (LRCLIB, iTunes, MusicBrainz, cifrados)
ureq = "3.4.2"
percent-encoding = "2"
# Servir la API por un socket Unix o por loopback (las pruebas de la
# interfaz y la línea de órdenes)
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "io-util", "time", "sync", "signal"], optional = true }
# El vigilante de carpetas (lo que hacía watchdog): inotify en Linux,
# FSEvents en el Mac, ReadDirectoryChangesW en Windows
notify = "8.2.0"

[target.'cfg(unix)'.dependencies]
# La máscara de permisos antes de crear el socket (sin `unsafe`)
rustix = { version = "1", features = ["process", "fs"] }

[lints]
workspace = true

[dev-dependencies]
# leer el .danpista en las pruebas (la biblioteca lo escribe con este mismo)
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# el proyecto de Ableton (.als, en gzip) de las secuencias de prueba
flate2 = "1.1.10"
