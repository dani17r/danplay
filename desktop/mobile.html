<!doctype html>
<!-- La app del celular (`mobile/`): la misma interfaz, con su propia entrada.
     `data-app` le dice a la interfaz que esconda lo que es solo de la PC
     (src/platform.js). -->
<html lang="es" data-app="mobile">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DanPlay</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/mobile/main.js"></script>
  </body>
</html>
