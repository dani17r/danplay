[package]
name = "danplay-app"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "io-util", "fs", "sync"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio", "http1"] }
http-body-util = "0.1"
mime_guess = "2"
rand = "0.9"
rodio = { version = "0.20", default-features = false, features = [
    "symphonia-mp3", "symphonia-wav", "symphonia-flac", "symphonia-vorbis",
    "symphonia-aac", "symphonia-isomp4", "symphonia-alac", "symphonia-aiff" ] }
# rodio 0.20 activa el CODEC vorbis pero no el DEMUXER ogg, asi que un .ogg
# se rechazaba con «Unrecognized format». La feature vive en symphonia, no en
# rodio: se pide aqui y la unificacion de features la aplica a la misma copia
# del crate que usa rodio por dentro.
symphonia = { version = "0.5", default-features = false, features = ["ogg"] }

# Reproduccion en el sistema (MPRIS en Linux, SMTC en Windows, Now Playing en
# macOS): teclas multimedia, pantalla de bloqueo y el reproductor del escritorio.
souvlaki = "0.8"

[target.'cfg(unix)'.dependencies]
# El nucleo escucha en un socket Unix 0600. En Windows no existe (ni uvicorn
# sabe de named pipes), asi que alli se usa TCP en loopback con token.
hyperlocal = "0.9"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# La bandeja de Tauri usa libappindicator, que NO entrega los clics sobre el
# icono. ksni habla StatusNotifierItem por D-Bus directamente: clic izquierdo,
# clic central y rueda incluidos.
ksni = "0.3"

[target.'cfg(not(target_os = "linux"))'.dependencies]
# Fuera de Linux la bandeja de Tauri si entrega los clics, con la posicion
# exacta del icono; alli se usa esa y el popup se pega al icono.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }

[target.'cfg(windows)'.dependencies]
# Sin PDEATHSIG: en Windows la forma de que el nucleo muera con la app es
# meterlo en un Job Object que se cierra al morir el proceso padre.
win32job = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# El crate del nucleo ya se compilaba asi; la app no, y es la que arranca en
# frio cada vez. Menos binario que cargar y codigo mas rapido.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Sin `panic = "abort"`: el hilo de audio decodifica archivos de fuera, y un
# mp3 corrupto que hiciera panic tumbaba la aplicacion entera. Desenrollando,
# el hilo se cae solo y se puede levantar otra vez.
panic = "unwind"
