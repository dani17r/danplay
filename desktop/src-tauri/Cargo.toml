[package]
name = "danplay-app"
version.workspace = true
edition.workspace = true
# El minimo de sus dependencias: notify-rust (el de las notificaciones de
# Linux) pide 1.89; la edicion 2024, 1.85.
rust-version = "1.89"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
# Abrir enlaces, archivos y carpetas con lo que diga el sistema (ShellExecuteW
# en Windows, xdg-open y FileManager1 en Linux). Solo se usa desde Rust: el
# plugin no se registra, asi que la interfaz no gana ningun comando nuevo.
tauri-plugin-opener = "2"
# Los avisos a un archivo en la carpeta de registros de la app: en Windows,
# en una compilacion de verdad, no hay consola y un eprintln! no llega a
# ningun sitio.
tauri-plugin-log = "2"
log = "0.4"
# El audio que decodifica ffmpeg llega por una tuberia; un hilo la lee y lo
# deja en un anillo sin candados del que tira el hilo del mezclador.
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio", "http1"] }
http-body-util = "0.1"
rand = "0.10"
# `vorbis` trae tambien el demuxer ogg: con rodio 0.20 habia que pedirlo a
# symphonia a mano (un .ogg salia «Unrecognized format»); ahora lo pide rodio.
rodio = { version = "0.22", default-features = false, features = [
    "playback", "mp3", "wav", "flac", "vorbis", "mp4", "symphonia-alac", "symphonia-aiff" ] }

# Reproduccion en el sistema (MPRIS en Linux, SMTC en Windows, Now Playing en
# macOS): teclas multimedia, pantalla de bloqueo y el reproductor del escritorio.
souvlaki = "0.8"
# Para detectar el pulso y el compas de una cancion (el metronomo del modo
# estudio): la envolvente de ataques sale de una FFT por trama.
rustfft = "6.2"

[target.'cfg(unix)'.dependencies]
# El nucleo escucha en un socket Unix 0600. En Windows no existe (ni uvicorn
# sabe de named pipes), asi que alli se usa TCP en loopback con token.
hyperlocal = "0.9"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# La bandeja de Tauri usa libappindicator, que NO entrega los clics sobre el
# icono. ksni habla StatusNotifierItem por D-Bus directamente: clic izquierdo,
# clic central y rueda incluidos.
ksni = "0.3"

[target.'cfg(not(target_os = "linux"))'.dependencies]
# Fuera de Linux la bandeja de Tauri si entrega los clics, con la posicion
# exacta del icono; alli se usa esa y el popup se pega al icono.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }

[target.'cfg(windows)'.dependencies]
# Sin PDEATHSIG: en Windows la forma de que el nucleo muera con la app es
# meterlo en un Job Object que se cierra al morir el proceso padre.
win32job = "2"
# Para registrar DanPlay como reproductor de musica: todo en HKCU, asi que no
# hace falta ser administrador ni tocar nada de los demas usuarios.
winreg = "0.56"

[lints]
workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
