# Los comandos propios que puede invocar cada ventana, por grupos. Los
# permisos de cada comando (`allow-<comando>`) los genera `build.rs` en
# `autogenerated/`; aqui solo se juntan, y `capabilities/` da a cada ventana
# su grupo. La ventanita y la de proyeccion reciben SOLO lo que invocan: ni
# el puente con el nucleo (salvo la proyeccion, que lee la letra) ni
# Telegram, ni abrir nada en el sistema.

[[set]]
identifier = "ventana-principal"
description = "Todo: la ventana principal es la aplicacion entera."
permissions = [
  "allow-api",
  "allow-core-ready",
  "allow-set-queue",
  "allow-queue-next",
  "allow-queue-previous",
  "allow-queue-jump",
  "allow-set-repeat",
  "allow-set-shuffle",
  "allow-toggle-pause",
  "allow-stop",
  "allow-seek",
  "allow-set-volume",
  "allow-set-speed",
  "allow-set-loop",
  "allow-set-pitch",
  "allow-set-metronome",
  "allow-set-stems",
  "allow-analyze-beats",
  "allow-playback-state",
  "allow-queue-items",
  "allow-show-window",
  "allow-hide-mini",
  "allow-toggle-mini",
  "allow-tray-available",
  "allow-show-projection",
  "allow-hide-projection",
  "allow-quit-app",
  "allow-default-player",
  "allow-make-default-player",
  "allow-reveal-in-folder",
  "allow-open-in-browser",
  "allow-open-html",
  "allow-share-targets",
  "allow-send-to-telegram",
]

[[set]]
identifier = "ventanita"
description = "El mini reproductor de la bandeja: lo que suena, los mandos (anterior, pausa, siguiente, la aguja), volver a la ventana grande y esconderse."
permissions = [
  "allow-playback-state",
  "allow-queue-items",
  "allow-toggle-pause",
  "allow-queue-previous",
  "allow-queue-next",
  "allow-seek",
  "allow-show-window",
  "allow-hide-mini",
]

[[set]]
identifier = "proyeccion"
description = "La letra en grande para el proyector: lo que suena, pausar con el espacio y leer la ficha de la cancion (la letra) del nucleo. Lo guardado (volumen, velocidad, repeticion) lo aplica solo la ventana principal."
permissions = [
  "allow-playback-state",
  "allow-queue-items",
  "allow-toggle-pause",
  "allow-api",
]
