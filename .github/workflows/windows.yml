# El instalador de Windows.
#
# Por que aqui y no en el equipo de nadie: PyInstaller **no compila para otro
# sistema**. El nucleo Python tiene que empaquetarse en Windows, y punto. Desde
# Linux se puede comprobar que el codigo de Rust compila para Windows (lo hace
# `pruebas.yml`), pero el ejecutable completo sale de aqui.
#
# Deja el instalador (.exe de NSIS) como artefacto descargable, y si el push
# lleva una etiqueta de version (`git tag v1.13.0 && git push --tags`),
# ademas lo publica en esa version.
name: windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      con_herramientas:
        description: 'Incluir ffmpeg, fpcalc y Deno dentro del instalador (+130 MB)'
        type: boolean
        default: true

permissions:
  contents: write     # publicar el instalador en la version

env:
  # En Windows no hay `apt install ffmpeg`: o van dentro o el usuario se queda
  # sin conversion de formatos, sin identificacion por sonido y sin YouTube.
  CON_HERRAMIENTAS: ${{ github.event_name == 'push' && 'true' || inputs.con_herramientas }}
  # Lo que se mete dentro, con version fija y su suma SHA-256. Antes se bajaba
  # «la ultima» sin comprobar nada: dos instaladores de la misma version podian
  # llevar un ffmpeg distinto, y nadie habria notado uno manipulado.
  FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip
  FFMPEG_SHA256: 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba
  FPCALC_URL: https://github.com/acoustid/chromaprint/releases/download/v1.6.1/chromaprint-fpcalc-1.6.1-windows-x86_64.zip
  FPCALC_SHA256: 735d6182b38e9f364b84ce6f4ccd682c75e2851de89735711d6b762d12b92a4e
  # YouTube ya exige un motor de JavaScript para yt-dlp; Deno es el que usa
  # por defecto (ver danplay/youtube.py).
  DENO_URL: https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-pc-windows-msvc.zip
  DENO_SHA256: a0c3101b4158d1dfb7d6a78a7bf0f3de80c96bb423c152beec8beb22786f2238

jobs:
  instalador:
    name: instalador de Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: dependencias de Python
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # con hashes (salen de uv.lock): pip comprueba cada paquete
          pip install -r requirements.txt -r requirements-test.txt
          # PyInstaller aparte (en una orden con hashes no se puede mezclar uno
          # sin ellos), con la misma version que en desarrollo
          $pyinstaller = (Select-String -Path requirements-dev.txt -Pattern '^pyinstaller==' -CaseSensitive:$false).Line
          pip install $pyinstaller

      # Antes que las pruebas: el nucleo se prueba con las mismas herramientas
      # que viajan en el instalador (sin ffmpeg, las pruebas que generan una
      # biblioteca se saltan y la cobertura no llega al minimo).
      - name: ffmpeg, fpcalc y Deno
        shell: pwsh
        run: |
          $tools = "desktop/src-tauri/tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          function Bajar($url, $sha, $archivo) {
            Invoke-WebRequest -Uri $url -OutFile $archivo
            $real = (Get-FileHash $archivo -Algorithm SHA256).Hash.ToLower()
            if ($real -ne $sha) { throw "$archivo no es lo esperado: $real" }
          }
          Bajar $env:FFMPEG_URL $env:FFMPEG_SHA256 ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          Get-ChildItem -Recurse ffmpeg-tmp -Include ffmpeg.exe,ffprobe.exe |
            ForEach-Object { Copy-Item $_.FullName $tools }
          Bajar $env:FPCALC_URL $env:FPCALC_SHA256 fpcalc.zip
          Expand-Archive fpcalc.zip -DestinationPath fpcalc-tmp
          Get-ChildItem -Recurse fpcalc-tmp -Include fpcalc.exe |
            ForEach-Object { Copy-Item $_.FullName $tools }
          Bajar $env:DENO_URL $env:DENO_SHA256 deno.zip
          Expand-Archive deno.zip -DestinationPath deno-tmp
          Get-ChildItem -Recurse deno-tmp -Include deno.exe |
            ForEach-Object { Copy-Item $_.FullName $tools }
          Get-ChildItem $tools

      # Las pruebas ANTES de empaquetar: si el nucleo no funciona en Windows,
      # mejor enterarse aqui que dentro de un instalador. Sin el crate de
      # Rust, como viaja en el instalador.
      - name: pruebas del núcleo en Windows
        shell: pwsh
        env:
          DANPLAY_SIN_RUST: '1'
        run: |
          $env:PATH = "$(Resolve-Path desktop/src-tauri/tools);$env:PATH"
          pytest

      - name: interfaz
        working-directory: desktop
        run: |
          npm ci
          npx vite build

      - name: núcleo empaquetado
        run: |
          pyinstaller --noconfirm --clean --distpath dist/core packaging/core.spec
          if (-not (Test-Path dist/core/danplay-core.exe)) { throw "no se genero el nucleo" }

      - name: el núcleo arranca y responde
        shell: pwsh
        run: |
          $puerto = 8731
          $env:DANPLAY_TOKEN = "prueba-de-humo"
          $p = Start-Process -PassThru -FilePath dist/core/danplay-core.exe `
               -ArgumentList "--host","127.0.0.1","--port","$puerto"
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 1
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:$puerto/api/status" `
                     -Headers @{ Authorization = "Bearer prueba-de-humo" } -TimeoutSec 3
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "el nucleo no contesto en 30 s" }
            # y sin el token no deberia contestar
            try {
              Invoke-WebRequest -Uri "http://127.0.0.1:$puerto/api/status" -TimeoutSec 3 | Out-Null
              throw "contesto SIN el token: el transporte no esta protegido"
            } catch [System.Net.WebException] { }
              catch [Microsoft.PowerShell.Commands.HttpResponseException] { }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: el núcleo, junto a la app
        shell: pwsh
        run: |
          $triple = (rustc -vV | Select-String '^host:').ToString().Split(' ')[1]
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/binaries | Out-Null
          Copy-Item dist/core/danplay-core.exe "desktop/src-tauri/binaries/danplay-core-$triple.exe"

      # Las herramientas ya estan (las usaron las pruebas): sin ellas en el
      # instalador, la carpeta se queda solo con el aviso.
      - name: sin herramientas, la carpeta vacía igualmente
        if: env.CON_HERRAMIENTAS != 'true'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force desktop/src-tauri/tools
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/tools | Out-Null
          Set-Content desktop/src-tauri/tools/LEEME.txt `
            "Aqui van ffmpeg.exe, ffprobe.exe, fpcalc.exe y deno.exe si se quieren dentro del instalador."

      - name: instalador
        working-directory: desktop
        run: npx tauri build --bundles nsis

      - name: qué salió
        shell: pwsh
        run: Get-ChildItem -Recurse target/release/bundle -Include *.exe

      - uses: actions/upload-artifact@v7
        with:
          name: danplay-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: publicar en la versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: target/release/bundle/nsis/*.exe
