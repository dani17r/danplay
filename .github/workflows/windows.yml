# El instalador de Windows.
#
# Por que aqui y no en el equipo de nadie: PyInstaller **no compila para otro
# sistema**. El nucleo Python tiene que empaquetarse en Windows, y punto. Desde
# Linux se puede comprobar que el codigo de Rust compila para Windows (lo hace
# `tests.yml`), pero el ejecutable completo sale de aqui.
#
# Deja el instalador (.exe de NSIS) y el portatil (.zip) como artefactos
# descargables, y si el push lleva una etiqueta de version
# (`git tag v1.13.0 && git push --tags`), ademas los publica en esa version.
name: windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      with_tools:
        description: 'Incluir ffmpeg, fpcalc y QuickJS dentro del instalador (+40 MB)'
        type: boolean
        default: true

permissions:
  contents: write     # publicar el instalador en la version

env:
  # En Windows no hay `apt install ffmpeg`: o van dentro o el usuario se queda
  # sin conversion de formatos, sin identificacion por sonido y sin YouTube.
  WITH_TOOLS: ${{ github.event_name == 'push' && 'true' || inputs.with_tools }}
  # Lo que se mete dentro, con version fija y su suma SHA-256. Antes se bajaba
  # «la ultima» sin comprobar nada: dos instaladores de la misma version podian
  # llevar un ffmpeg distinto, y nadie habria notado uno manipulado.
  FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip
  FFMPEG_SHA256: 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba
  FPCALC_URL: https://github.com/acoustid/chromaprint/releases/download/v1.6.1/chromaprint-fpcalc-1.6.1-windows-x86_64.zip
  FPCALC_SHA256: 735d6182b38e9f364b84ce6f4ccd682c75e2851de89735711d6b762d12b92a4e
  # YouTube ya exige un motor de JavaScript para yt-dlp: QuickJS-NG, un
  # .exe suelto de 2 MB (Deno, el de antes, pesaba 93; ver danplay/ytdlp.py).
  QJS_URL: https://github.com/quickjs-ng/quickjs/releases/download/v0.17.0/qjs-windows-x86_64.exe
  QJS_SHA256: 2aeabf0092c3262d6b2609824418f7dd7ed1f1df939f73b2b15645230cac0d77

jobs:
  installer:
    name: instalador de Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      # v1: las cachés v0 son del perfil de antes (Cargo.toml) y, con la misma
      # clave, se restauraban sin servir y nunca se renovaban
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust

      - name: dependencias de Python
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # con hashes (salen de uv.lock): pip comprueba cada paquete. Sin
          # los de las pruebas: esas ya corren en tests.yml
          pip install -r requirements.txt
          # PyInstaller aparte (en una orden con hashes no se puede mezclar uno
          # sin ellos), con la misma version que en desarrollo
          $pyinstaller = (Select-String -Path requirements-dev.txt -Pattern '^pyinstaller==' -CaseSensitive:$false).Line
          pip install $pyinstaller
          # el crate de Rust del nucleo (las etiquetas, con lofty): se compila
          # aqui, con maturin, y el nucleo empaquetado lo lleva dentro
          pip install ./core

      # Lo que viaja dentro del instalador, con version fija y su sha256.
      # ffprobe ya no: lo poco que medía (una caratula, la duracion de una
      # secuencia) sale de las cabeceras de los archivos.
      - name: ffmpeg, fpcalc y QuickJS
        shell: pwsh
        run: |
          $tools = "desktop/src-tauri/tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          function Download($url, $sha, $file) {
            Invoke-WebRequest -Uri $url -OutFile $file
            $real = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            if ($real -ne $sha) { throw "$file no es lo esperado: $real" }
          }
          Download $env:FFMPEG_URL $env:FFMPEG_SHA256 ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          Get-ChildItem -Recurse ffmpeg-tmp -Include ffmpeg.exe |
            ForEach-Object { Copy-Item $_.FullName $tools }
          Download $env:FPCALC_URL $env:FPCALC_SHA256 fpcalc.zip
          Expand-Archive fpcalc.zip -DestinationPath fpcalc-tmp
          Get-ChildItem -Recurse fpcalc-tmp -Include fpcalc.exe |
            ForEach-Object { Copy-Item $_.FullName $tools }
          Download $env:QJS_URL $env:QJS_SHA256 "$tools/qjs.exe"
          Get-ChildItem $tools

      # Las pruebas del nucleo en Windows (sin el crate de Rust, como viaja en
      # el instalador) no van aqui: ya las pasa tests.yml en cada push, y
      # delante del instalador lo retrasaban siete minutos. Lo que si se
      # comprueba aqui es el nucleo ya empaquetado (abajo).

      - name: interfaz
        working-directory: desktop
        run: |
          npm ci
          npx vite build

      - name: núcleo empaquetado
        run: |
          pyinstaller --noconfirm --clean --distpath dist/core packaging/core.spec
          if (-not (Test-Path dist/core/danplay-core/danplay-core.exe)) { throw "no se genero el nucleo" }
          # con el crate de Rust y sin mutagen, que es GPL (ver core.spec)
          if (-not (Test-Path dist/core/danplay-core/_internal/danplay_core)) { throw "el nucleo no lleva el crate de Rust" }
          if (Test-Path dist/core/danplay-core/_internal/mutagen) { throw "se colo mutagen en el nucleo" }
          # y la biblioteca de ONNX Runtime que carga el pulso desde Rust
          if (-not (Test-Path dist/core/danplay-core/_internal/onnxruntime/capi/onnxruntime.dll)) { throw "el nucleo no lleva onnxruntime.dll" }

      - name: el núcleo arranca y responde
        shell: pwsh
        run: |
          $port = 8731
          $env:DANPLAY_TOKEN = "smoke-test"
          $p = Start-Process -PassThru -FilePath dist/core/danplay-core/danplay-core.exe `
               -ArgumentList "--host","127.0.0.1","--port","$port"
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 1
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/status" `
                     -Headers @{ Authorization = "Bearer smoke-test" } -TimeoutSec 3
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) {
              # sin consola no se ve nada: lo que quede es su registro
              if ($p.HasExited) { Write-Host "el nucleo se cerro con el codigo $($p.ExitCode)" }
              $logFile = Join-Path $env:LOCALAPPDATA "danplay\logs\danplay.log"
              if (Test-Path $logFile) { Get-Content $logFile -Tail 40 }
              throw "el nucleo no contesto en 30 s"
            }
            # y sin el token no deberia contestar
            try {
              Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/status" -TimeoutSec 3 | Out-Null
              throw "contesto SIN el token: el transporte no esta protegido"
            } catch [System.Net.WebException] { }
              catch [Microsoft.PowerShell.Commands.HttpResponseException] { }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      # una carpeta (onedir) entre los recursos de Tauri, core/: asi no se
      # descomprime en cada arranque ni hay un cargador aparte del Python de
      # verdad (ver packaging/core.spec)
      - name: el núcleo, junto a la app
        shell: pwsh
        run: Copy-Item -Recurse -Force dist/core/danplay-core/* desktop/src-tauri/core/

      # Las herramientas ya estan: sin ellas en el instalador, la carpeta se
      # queda solo con el aviso.
      - name: sin herramientas, la carpeta vacía igualmente
        if: env.WITH_TOOLS != 'true'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force desktop/src-tauri/tools
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/tools | Out-Null
          Set-Content desktop/src-tauri/tools/LEEME.txt `
            "Aqui van ffmpeg.exe, fpcalc.exe y qjs.exe si se quieren dentro del instalador."

      - name: instalador
        working-directory: desktop
        run: npx tauri build --bundles nsis

      - name: qué salió
        shell: pwsh
        run: Get-ChildItem -Recurse target/release/bundle -Include *.exe

      # El portátil (un .zip que se descomprime y arranca, sin instalar nada):
      # lo mismo que lleva el instalador, de la misma compilación, así que no
      # pueden ser distintos. Antes se armaba aparte, desde Linux, con el Python
      # embebido de Windows; desde que el núcleo lleva su crate de Rust (las
      # etiquetas) eso pediría compilarlo para Windows desde Linux.
      - name: portátil
        shell: pwsh
        run: |
          $version = (Select-String -Path danplay/__init__.py -Pattern '^__version__ = "(.+)"').Matches[0].Groups[1].Value
          $dir = "dist/windows"
          New-Item -ItemType Directory -Force -Path $dir, dist/installers | Out-Null
          Copy-Item target/release/danplay-app.exe $dir
          Copy-Item -Recurse desktop/src-tauri/core "$dir/core"
          Copy-Item -Recurse desktop/src-tauri/tools "$dir/tools"
          Set-Content -Encoding utf8 "$dir/LEEME.txt" @"
          DanPlay para Windows (version portatil)

          No hay que instalar nada: ejecuta danplay-app.exe.

            danplay-app.exe   la aplicacion
            core\             el nucleo de DanPlay
            tools\            ffmpeg.exe, fpcalc.exe y qjs.exe: conversion de
                              formatos, reproduccion de .opus y .wma,
                              identificar por el sonido y bajar de YouTube

          Hace falta WebView2, que Windows 10 y 11 actualizados ya traen. Si la
          ventana sale en blanco: https://developer.microsoft.com/microsoft-edge/webview2/

          DanPlay es obra de Daniel Rangel (https://t.me/Dani17r).
          "@
          Compress-Archive -Path $dir -DestinationPath "dist/installers/DanPlay-$version-windows-portatil.zip"
          Get-Item dist/installers/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: danplay-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: danplay-windows-portable
          path: dist/installers/DanPlay-*-windows-portatil.zip
          if-no-files-found: error

      - name: publicar en la versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/release/bundle/nsis/*.exe
            dist/installers/DanPlay-*-windows-portatil.zip
