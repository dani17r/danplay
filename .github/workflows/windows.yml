# El instalador de Windows.
#
# Sin Python: el nucleo va dentro de la app (el crate `server`). Desde Linux
# se compila igual (scripts/build-windows-cross.sh, y `tests.yml` comprueba
# que el codigo de Rust compila para Windows), pero el instalador de verdad,
# con MSVC y el NSIS de Tauri, sale de aqui. Las pruebas del nucleo de
# Python, solo en tests.yml.
#
# Deja el instalador (.exe de NSIS) y el portatil (.zip) como artefactos
# descargables, y si el push lleva una etiqueta de version
# (`git tag v1.13.0 && git push --tags`), ademas los publica en esa version.
name: windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      with_tools:
        description: 'Incluir ffmpeg, fpcalc, QuickJS y yt-dlp dentro del instalador (+80 MB)'
        type: boolean
        default: true

permissions:
  contents: write     # publicar el instalador en la version

env:
  # En Windows no hay `apt install ffmpeg`: o van dentro o el usuario se queda
  # sin conversion de formatos, sin identificacion por sonido y sin YouTube.
  WITH_TOOLS: ${{ github.event_name == 'push' && 'true' || inputs.with_tools }}
  # Lo que se mete dentro, con version fija y su suma SHA-256. Antes se bajaba
  # «la ultima» sin comprobar nada: dos instaladores de la misma version podian
  # llevar un ffmpeg distinto, y nadie habria notado uno manipulado.
  FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip
  FFMPEG_SHA256: 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba
  FPCALC_URL: https://github.com/acoustid/chromaprint/releases/download/v1.6.1/chromaprint-fpcalc-1.6.1-windows-x86_64.zip
  FPCALC_SHA256: 735d6182b38e9f364b84ce6f4ccd682c75e2851de89735711d6b762d12b92a4e
  # YouTube ya exige un motor de JavaScript para yt-dlp: QuickJS-NG, un
  # .exe suelto de 2 MB (Deno, el de antes, pesaba 93).
  QJS_URL: https://github.com/quickjs-ng/quickjs/releases/download/v0.17.0/qjs-windows-x86_64.exe
  QJS_SHA256: 2aeabf0092c3262d6b2609824418f7dd7ed1f1df939f73b2b15645230cac0d77
  # yt-dlp, su ejecutable oficial (el de Linux y macOS: scripts/tools-*.sh)
  YTDLP_URL: https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp.exe
  YTDLP_SHA256: 66674953fe251b89f4d08c5f0e35e0728679bd67ab3d7d05c0562af101dd3e7a
  # ONNX Runtime oficial (el pulso, el separador, las voces), el mismo que
  # scripts/data.sh: de su .zip solo hace falta onnxruntime.dll y su licencia
  ORT_URL: https://github.com/microsoft/onnxruntime/releases/download/v1.31.0/onnxruntime-win-x64-1.31.0.zip
  ORT_SHA256: 3958d8a44984160692c1b4ffd0de3cb48f8c39f9d34bb31e433db06e30b82195

jobs:
  installer:
    name: instalador de Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Bun (el gestor de paquetes de la interfaz) y Vite+ (vp), en las
      # versiones que fija desktop/package.json (packageManager y vite-plus).
      # setup-vp, a una versión exacta: su etiqueta v1 ya no se mueve.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: desktop/package.json
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          working-directory: desktop
          node-version: '24'
          # el Bun de arriba, no otro
          package-manager: false
          cache: true
          run-install: false

      - uses: dtolnay/rust-toolchain@stable
      # v1: las cachés v0 son del perfil de antes (Cargo.toml) y, con la misma
      # clave, se restauraban sin servir y nunca se renovaban
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: v1-rust

      # Lo que viaja dentro del instalador, con version fija y su sha256.
      # ffprobe ya no: lo poco que medía (una caratula, la duracion de una
      # secuencia) sale de las cabeceras de los archivos.
      - name: ffmpeg, fpcalc, QuickJS y yt-dlp
        if: env.WITH_TOOLS == 'true'
        shell: pwsh
        run: |
          $tools = "desktop/src-tauri/tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          function Download($url, $sha, $file) {
            Invoke-WebRequest -Uri $url -OutFile $file
            $real = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            if ($real -ne $sha) { throw "$file no es lo esperado: $real" }
          }
          Download $env:FFMPEG_URL $env:FFMPEG_SHA256 ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          Get-ChildItem -Recurse ffmpeg-tmp -Include ffmpeg.exe |
            ForEach-Object { Copy-Item $_.FullName $tools }
          Download $env:FPCALC_URL $env:FPCALC_SHA256 fpcalc.zip
          Expand-Archive fpcalc.zip -DestinationPath fpcalc-tmp
          Get-ChildItem -Recurse fpcalc-tmp -Include fpcalc.exe |
            ForEach-Object { Copy-Item $_.FullName $tools }
          Download $env:QJS_URL $env:QJS_SHA256 "$tools/qjs.exe"
          Download $env:YTDLP_URL $env:YTDLP_SHA256 "$tools/yt-dlp.exe"
          Get-ChildItem $tools

      # Sin ellas en el instalador, la carpeta se queda solo con el aviso.
      - name: sin herramientas, la carpeta vacía igualmente
        if: env.WITH_TOOLS != 'true'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force desktop/src-tauri/tools
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/tools | Out-Null
          Set-Content desktop/src-tauri/tools/LEEME.txt `
            "Aqui van ffmpeg.exe, fpcalc.exe, qjs.exe y yt-dlp.exe si se quieren dentro del instalador."

      # Lo que hace scripts/data.sh en Linux y macOS: lo de data/ y
      # ONNX Runtime, en desktop/src-tauri/data (siempre: sin el no hay pulso,
      # ni separar, ni voces)
      - name: los datos y ONNX Runtime
        shell: pwsh
        run: |
          $data = Join-Path $PWD "desktop/src-tauri/data"
          Invoke-WebRequest -Uri $env:ORT_URL -OutFile ort.zip
          $real = (Get-FileHash ort.zip -Algorithm SHA256).Hash.ToLower()
          if ($real -ne $env:ORT_SHA256) { throw "ort.zip no es lo esperado: $real" }
          # del .zip, solo la biblioteca y su licencia: con sus simbolos son 450 MB
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $PWD ort.zip))
          try {
            $wanted = @{ 'lib/onnxruntime.dll' = 'onnxruntime.dll'; 'LICENSE' = 'LICENSE-onnxruntime.txt'
                         'ThirdPartyNotices.txt' = 'ThirdPartyNotices-onnxruntime.txt' }
            foreach ($name in $wanted.Keys) {
              $entry = $zip.GetEntry("onnxruntime-win-x64-1.31.0/$name")
              if (-not $entry) { throw "el .zip de ONNX Runtime no trae $name" }
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $data $wanted[$name]), $true)
            }
          } finally {
            $zip.Dispose()
          }
          foreach ($item in 'pulse', 'separator', 'voices.json', 'models-snapshot.json') {
            Copy-Item -Recurse "data/$item" $data
          }
          Get-ChildItem $data

      # Compilada sin empaquetar todavia: antes se saca con ella la foto del
      # catalogo de modelos de IA (abajo).
      - name: la app
        working-directory: desktop
        run: |
          vp install --frozen-lockfile
          vp exec tauri build --no-bundle

      # La de hoy (lo que hacia scripts/update-models.py); sin red, la que hay.
      # Con Start-Process -Wait: es una app de ventanas, y sin eso PowerShell
      # no la espera.
      - name: la foto del catálogo de modelos
        shell: pwsh
        run: |
          $p = Start-Process -Wait -PassThru -NoNewWindow -FilePath target/release/danplay-app.exe `
               -ArgumentList '--models-snapshot', 'desktop/src-tauri/data/models-snapshot.json'
          Write-Host "salio con $($p.ExitCode)"
          Get-Item desktop/src-tauri/data/models-snapshot.json

      # La propia app con un argumento, como la lanza el nucleo: el detector
      # de pulso con el grafo, ONNX Runtime y ffmpeg que viajan con ella.
      - name: el pulso de una canción, con su ONNX Runtime
        if: env.WITH_TOOLS == 'true'
        shell: pwsh
        run: |
          $tools = "desktop/src-tauri/tools"
          & "$tools/ffmpeg.exe" -loglevel error -f lavfi `
            -i "aevalsrc='0.8*sin(2*PI*1500*t)*lt(mod(t\,0.5)\,0.03)':s=44100:d=12" `
            -c:a libmp3lame clic.mp3
          $env:DANPLAY_ONNXRUNTIME = "desktop/src-tauri/data"
          $p = Start-Process -Wait -PassThru -NoNewWindow -FilePath target/release/danplay-app.exe `
               -RedirectStandardOutput pulso.txt -RedirectStandardError pulso-err.txt `
               -ArgumentList '--pulse', 'desktop/src-tauri/data/pulse/beat_this.onnx', "$tools/ffmpeg.exe", 'clic.mp3', 'crudo.json'
          $last = Get-Content pulso.txt | Select-Object -Last 1
          Write-Host $last
          if ($last -notmatch '"ok": true') { Get-Content pulso-err.txt; throw "el pulso fallo ($($p.ExitCode))" }
          if (-not (Test-Path crudo.json)) { throw "el pulso no dejo lo que oyo" }

      - name: instalador
        working-directory: desktop
        run: vp exec tauri bundle --bundles nsis

      - name: qué salió
        shell: pwsh
        run: Get-ChildItem -Recurse target/release/bundle -Include *.exe

      # El portátil (un .zip que se descomprime y arranca, sin instalar nada):
      # lo mismo que lleva el instalador, de la misma compilación, así que no
      # pueden ser distintos.
      - name: portátil
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $dir = "dist/windows"
          New-Item -ItemType Directory -Force -Path $dir, dist/installers | Out-Null
          Copy-Item target/release/danplay-app.exe $dir
          Copy-Item -Recurse desktop/src-tauri/data "$dir/data"
          Copy-Item -Recurse desktop/src-tauri/tools "$dir/tools"
          Set-Content -Encoding utf8 "$dir/LEEME.txt" @"
          DanPlay para Windows (version portatil)

          No hay que instalar nada: ejecuta danplay-app.exe.

            danplay-app.exe   la aplicacion, con el nucleo dentro
            data\             los modelos (el pulso, el separador), las voces
                              de las guias y ONNX Runtime, que los mueve
            tools\            ffmpeg.exe, fpcalc.exe, qjs.exe y yt-dlp.exe:
                              conversion de formatos, reproduccion de .opus
                              y .wma, identificar por el sonido y bajar de
                              YouTube

          Hace falta WebView2, que Windows 10 y 11 actualizados ya traen. Si la
          ventana sale en blanco: https://developer.microsoft.com/microsoft-edge/webview2/

          DanPlay es obra de Daniel Rangel (https://t.me/Dani17r).
          "@
          Compress-Archive -Path $dir -DestinationPath "dist/installers/DanPlay-$version-windows-portatil.zip"
          Get-Item dist/installers/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: danplay-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: danplay-windows-portable
          path: dist/installers/DanPlay-*-windows-portatil.zip
          if-no-files-found: error

      - name: publicar en la versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/release/bundle/nsis/*.exe
            dist/installers/DanPlay-*-windows-portatil.zip
