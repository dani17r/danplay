# El paquete de macOS (.dmg y la .app en un .zip).
#
# Por que aqui y no en el equipo de nadie: ni Tauri ni PyInstaller compilan
# para macOS desde Linux (hace falta el SDK de Apple y un Mac). Salen dos, uno
# por procesador: Apple Silicon (M1 en adelante) e Intel.
#
# SIN FIRMA DE APPLE NI NOTARIZACION (no hay cuenta de desarrollador): va
# firmado «ad hoc», que es lo minimo para que un Mac con Apple Silicon lo deje
# arrancar. La primera vez macOS dira que no puede comprobar quien lo hizo:
# se abre igual desde Ajustes del Sistema > Privacidad y seguridad > «Abrir
# igualmente», o quitando la cuarentena:
#   xattr -dr com.apple.quarantine /Applications/DanPlay.app
#
# Nadie lo ha probado todavia en un Mac de verdad (ver docs/CONTRIBUIR.md),
# pero todas las versiones lo llevan: con una etiqueta de version
# (`git tag v1.13.0 && git push --tags`) se publica en ella como los demas.
name: macos

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write     # publicar los .dmg en la version

jobs:
  paquete:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # que uno falle no tumba el otro: son procesadores distintos
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            # el .dmg se llama asi: dice para que Mac es (el de Tauri dice aarch64)
            nombre: apple-silicon
            # Lo que se mete dentro, con version fija y su suma SHA-256 (las
            # mismas versiones que en Windows). En macOS tampoco hay gestor de
            # paquetes que ponga ffmpeg, y una app abierta desde el Finder no
            # ve el PATH de Homebrew.
            ffmpeg_url: https://ffmpeg.martin-riedl.de/download/macos/arm64/1789931890_9.0.2
            ffmpeg_sha256: c8ed4c4e6978a03c485edbfe4e0a5dc2380f8a30bba5150531b31b094492d924
            ffprobe_sha256: fcbe839537485eaee7a7a8bc5cbc0f90d53617e80943e8a5b2e31cb851197ea6
            deno: deno-aarch64-apple-darwin
            deno_sha256: 5cd46d6268f6f78f5d88bdc7159d20bd44cdaa4b3303474839f87ec6fe7ae25c
            onnxruntime: ''
          - runner: macos-15-intel
            arch: x86_64
            nombre: intel
            ffmpeg_url: https://ffmpeg.martin-riedl.de/download/macos/amd64/1789931006_9.0.2
            ffmpeg_sha256: 7c6b4125b191cbf773832dc51f424cf2b6bb7da43007d1e066f95909e47cacd4
            ffprobe_sha256: 2322438ed2f6319a691291b247d09c69dcaa3a982460d1f269a7e1af335cfdfd
            deno: deno-x86_64-apple-darwin
            deno_sha256: 95daaff11c116a52ad54785e7914c8e9c9cdcaba793c5ed929c74ca2d8e6259a
            # onnxruntime (el separador de pistas y el pulso) dejo de publicarse
            # para Mac Intel en la 1.24: aqui va la 1.23.2, la ultima que hay
            # (probado: los tres modelos de DanPlay cargan con ella), con lo que
            # ella pide y la 1.30 ya no (coloredlogs y sympy), todo con su hash.
            onnxruntime: |-
              onnxruntime==1.23.2 --hash=sha256:162f4ca894ec3de1a6fd53589e511e06ecdc3ff646849b62a9da7489dee9ce95
              coloredlogs==15.0.1 --hash=sha256:612ee75c546f53e92e70049c9dbfcc18c935a2b9a53b66085ce9ef6a6e5c0934
              humanfriendly==10.0 --hash=sha256:1697e1a8a8f550fd43c2865cd84542fc175a61dcb779b6fee18cf6b6ccba1477
              sympy==1.14.0 --hash=sha256:e091cc3e99d2141a0ba2847328f5479b05d94a6635cb96148ccb3f34671bd8f5
              mpmath==1.3.0 --hash=sha256:a0b2b9fe80bbcd81a6647ff13108738cfb482d481d826cc0e02f5b35e5c88d2c
    env:
      # fpcalc trae un unico binario para los dos procesadores
      FPCALC_URL: https://github.com/acoustid/chromaprint/releases/download/v1.6.1/chromaprint-fpcalc-1.6.1-macos-universal.tar.gz
      FPCALC_SHA256: 240aeb5a8c8205af458e3625cb7487b826b711a999e491ef00111f3cebd76f00
      DENO_VERSION: v2.9.7
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: ffmpeg, ffprobe, fpcalc y Deno
        run: |
          set -euo pipefail
          tools=desktop/src-tauri/tools
          mkdir -p "$tools" tmp-herramientas
          cd tmp-herramientas
          bajar() {  # url  suma  archivo
            curl -fsSL --retry 3 -o "$3" "$1"
            echo "$2  $3" | shasum -a 256 -c -
          }
          bajar "${{ matrix.ffmpeg_url }}/ffmpeg.zip" "${{ matrix.ffmpeg_sha256 }}" ffmpeg.zip
          bajar "${{ matrix.ffmpeg_url }}/ffprobe.zip" "${{ matrix.ffprobe_sha256 }}" ffprobe.zip
          bajar "https://github.com/denoland/deno/releases/download/$DENO_VERSION/${{ matrix.deno }}.zip" \
                "${{ matrix.deno_sha256 }}" deno.zip
          bajar "$FPCALC_URL" "$FPCALC_SHA256" fpcalc.tar.gz
          unzip -o -q ffmpeg.zip -d ../"$tools"
          unzip -o -q ffprobe.zip -d ../"$tools"
          unzip -o -q deno.zip -d ../"$tools"
          tar xzf fpcalc.tar.gz
          cp chromaprint-fpcalc-*/fpcalc ../"$tools"/
          cd ..
          rm -rf tmp-herramientas
          chmod +x "$tools"/*
          ls -la "$tools"
          "$tools/ffmpeg" -hide_banner -version | head -1
          "$tools/fpcalc" -version

      - name: dependencias de Python
        env:
          ORT: ${{ matrix.onnxruntime }}
        run: |
          python -m pip install --upgrade pip
          req=requirements.txt
          if [ -n "$ORT" ]; then
            # la misma lista, con el onnxruntime que si existe para este Mac
            python - <<'PY'
          import os, re, pathlib
          s = pathlib.Path("requirements.txt").read_text()
          s = re.sub(r"^onnxruntime==.*\n(?:\s+--hash=.*\n)*", os.environ["ORT"] + "\n", s, flags=re.M)
          pathlib.Path("requisitos-mac.txt").write_text(s)
          PY
            req=requisitos-mac.txt
            grep -n "^onnxruntime" "$req"
          fi
          # con hashes (salen de uv.lock); PyInstaller aparte, que en una orden
          # con hashes no se puede mezclar uno sin ellos
          pip install -r "$req" -r requirements-test.txt
          pip install "$(grep -i '^pyinstaller==' requirements-dev.txt)"

      # Nunca se han pasado en un Mac: se ejecutan para saber que falla, pero
      # no paran el paquete (el amigo que lo prueba es justo quien lo dira).
      - name: pruebas del núcleo en macOS
        continue-on-error: true
        env:
          DANPLAY_SIN_RUST: '1'
        run: |
          export PATH="$PWD/desktop/src-tauri/tools:$PATH"
          pytest

      - name: núcleo empaquetado
        run: |
          # la foto del catalogo de modelos de IA, la de hoy (sin red se queda la que hay)
          python scripts/actualizar-modelos.py || true
          pyinstaller --noconfirm --clean --distpath dist/core packaging/core.spec
          test -x dist/core/danplay-core

      - name: el núcleo arranca y responde
        run: |
          sock=$(mktemp -u)
          dist/core/danplay-core --uds "$sock" &
          pid=$!
          for i in $(seq 1 30); do
            curl -sf --unix-socket "$sock" http://x/api/status > /dev/null && break
            sleep 1
          done
          curl -sf --unix-socket "$sock" http://x/api/status > /dev/null
          kill $pid

      - name: el núcleo, junto a la app
        run: |
          triple=$(rustc -vV | awk '/^host:/{print $2}')
          mkdir -p desktop/src-tauri/binaries
          cp dist/core/danplay-core "desktop/src-tauri/binaries/danplay-core-$triple"

      # Firma «ad hoc» (`-`) y sin «hardened runtime»: con el, macOS solo deja
      # cargar bibliotecas firmadas por el mismo equipo de desarrollo, y el
      # nucleo de PyInstaller descomprime las suyas al arrancar (sin firma de
      # equipo): no arrancaria.
      - name: paquete
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles app,dmg \
            --config '{"bundle":{"macOS":{"signingIdentity":"-","hardenedRuntime":false}}}'

      - name: la .app en un .zip
        run: |
          cd target/release/bundle/macos
          ditto -c -k --keepParent DanPlay.app "DanPlay-macos-${{ matrix.arch }}.zip"
          ls -la

      - name: el .dmg, con el nombre de las versiones
        run: |
          version=$(sed -n 's/^__version__ = "\([^"]*\)"/\1/p' danplay/__init__.py)
          cd target/release/bundle/dmg
          mv DanPlay_*.dmg "DanPlay-$version-mac-${{ matrix.nombre }}.dmg"
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: danplay-macos-${{ matrix.arch }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.zip
          if-no-files-found: error

      # solo el .dmg: el .zip de la .app se queda en el artefacto
      - name: publicar en la versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: target/release/bundle/dmg/*.dmg
