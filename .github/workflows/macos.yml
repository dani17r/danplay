# El paquete de macOS (.dmg y la .app en un .zip).
#
# Por que aqui y no en el equipo de nadie: Tauri no compila para macOS desde
# Linux (hace falta el SDK de Apple y un Mac). Salen dos, uno por procesador:
# Apple Silicon (M1 en adelante) e Intel.
#
# Sin Python: el nucleo va dentro de la app (el crate `server`). Las pruebas
# del nucleo de Python, solo en tests.yml.
#
# SIN FIRMA DE APPLE NI NOTARIZACION (no hay cuenta de desarrollador): va
# firmado «ad hoc», que es lo minimo para que un Mac con Apple Silicon lo deje
# arrancar. La primera vez macOS dira que no puede comprobar quien lo hizo:
# se abre igual desde Ajustes del Sistema > Privacidad y seguridad > «Abrir
# igualmente», o quitando la cuarentena:
#   xattr -dr com.apple.quarantine /Applications/DanPlay.app
#
# Nadie lo ha probado todavia en un Mac de verdad (ver docs/CONTRIBUTING.md),
# pero todas las versiones lo llevan: con una etiqueta de version
# (`git tag v1.13.0 && git push --tags`) se publica en ella como los demas.
name: macos

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write     # publicar los .dmg en la version

jobs:
  package:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # que uno falle no tumba el otro: son procesadores distintos
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            # el .dmg se llama asi: dice para que Mac es (el de Tauri dice aarch64)
            dmg_name: apple-silicon
          - runner: macos-15-intel
            arch: x86_64
            dmg_name: intel
    steps:
      - uses: actions/checkout@v7

      # Bun (el gestor de paquetes de la interfaz) y Vite+ (vp), en las
      # versiones que fija desktop/package.json (packageManager y vite-plus).
      # setup-vp, a una versión exacta: su etiqueta v1 ya no se mueve.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: desktop/package.json
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          working-directory: desktop
          node-version: '24'
          # el Bun de arriba, no otro
          package-manager: false
          cache: true
          run-install: false

      - uses: dtolnay/rust-toolchain@stable
      # v1: las cachés v0 son del perfil de antes (Cargo.toml) y, con la misma
      # clave, se restauraban sin servir y nunca se renovaban
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: v1-rust

      # Lo que se mete dentro, con version fija y su sha256 (las mismas que en
      # Linux y Windows), para el procesador de este Mac
      - name: ffmpeg, fpcalc, QuickJS y yt-dlp
        run: |
          ./scripts/tools-macos.sh
          ls -la desktop/src-tauri/tools

      # ONNX Runtime 1.31.0 en Apple Silicon; en Intel, la 1.23.2, la ultima
      # que hay para ellos (ver el script)
      - name: los datos y ONNX Runtime
        run: |
          ./scripts/data.sh
          ls -la desktop/src-tauri/data

      # Compilada sin empaquetar todavia: antes se saca con ella la foto del
      # catalogo de modelos de IA (abajo).
      - name: la app
        working-directory: desktop
        run: |
          vp install --frozen-lockfile
          vp exec tauri build --no-bundle

      # la de hoy (lo que hacia scripts/update-models.py); sin red, la que hay
      - name: la foto del catálogo de modelos
        run: target/release/danplay-app --models-snapshot desktop/src-tauri/data/models-snapshot.json || true

      # La propia app con un argumento, como la lanza el nucleo: el detector
      # de pulso con el grafo, ONNX Runtime y ffmpeg que viajan con ella.
      - name: el pulso de una canción, con su ONNX Runtime
        run: |
          tools=desktop/src-tauri/tools
          $tools/ffmpeg -loglevel error -f lavfi \
            -i "aevalsrc='0.8*sin(2*PI*1500*t)*lt(mod(t\,0.5)\,0.03)':s=44100:d=12" \
            -c:a libmp3lame clic.mp3
          out=$(DANPLAY_ONNXRUNTIME=desktop/src-tauri/data target/release/danplay-app \
            --pulse desktop/src-tauri/data/pulse/beat_this.onnx $tools/ffmpeg clic.mp3 crudo.json)
          echo "$out" | tail -1
          echo "$out" | tail -1 | grep -q '"ok": true'
          test -s crudo.json

      # Firma «ad hoc» (`-`) y sin «hardened runtime»: con el, macOS solo deja
      # cargar bibliotecas firmadas por el mismo equipo de desarrollo, y ONNX
      # Runtime (data/) y los programas de tools/ vienen firmados por otros:
      # no se cargarian.
      - name: paquete
        working-directory: desktop
        run: |
          vp exec tauri bundle --bundles app,dmg \
            --config '{"bundle":{"macOS":{"signingIdentity":"-","hardenedRuntime":false}}}'

      # con el nucleo, sus datos y sus programas, y sin nada de Python
      - name: qué lleva la .app
        run: |
          app=target/release/bundle/macos/DanPlay.app/Contents
          ls "$app"/Resources/data/libonnxruntime.*.dylib "$app"/Resources/data/pulse/beat_this.onnx \
             "$app"/Resources/tools/ffmpeg "$app"/Resources/tools/yt-dlp
          if find "$app" | grep -iE 'python|\.pyc|/_internal/'; then
            echo "la .app lleva algo de Python"; exit 1
          fi

      - name: la .app en un .zip
        run: |
          cd target/release/bundle/macos
          ditto -c -k --keepParent DanPlay.app "DanPlay-macos-${{ matrix.arch }}.zip"
          ls -la

      - name: el .dmg, con el nombre de las versiones
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          cd target/release/bundle/dmg
          mv DanPlay_*.dmg "DanPlay-$version-mac-${{ matrix.dmg_name }}.dmg"
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: danplay-macos-${{ matrix.arch }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.zip
          if-no-files-found: error

      # solo el .dmg: el .zip de la .app se queda en el artefacto
      - name: publicar en la versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: target/release/bundle/dmg/*.dmg
