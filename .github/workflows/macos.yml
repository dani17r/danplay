# El paquete de macOS (.dmg y la .app en un .zip).
#
# Por que aqui y no en el equipo de nadie: Tauri no compila para macOS desde
# Linux (hace falta el SDK de Apple y un Mac). Salen dos, uno por procesador:
# Apple Silicon (M1 en adelante) e Intel.
#
# El nucleo va dentro de la app (el crate `server`). Sus pruebas en macOS,
# en tests.yml («nucleo en macOS»).
#
# SIN FIRMA DE APPLE NI NOTARIZACION (no hay cuenta de desarrollador): va
# firmado «ad hoc», que es lo minimo para que un Mac con Apple Silicon lo deje
# arrancar. La primera vez macOS dira que no puede comprobar quien lo hizo:
# se abre igual desde Ajustes del Sistema > Privacidad y seguridad > «Abrir
# igualmente», o quitando la cuarentena:
#   xattr -dr com.apple.quarantine /Applications/DanPlay.app
#
# Nadie lo ha probado todavia en un Mac de verdad (ver docs/CONTRIBUTING.md),
# pero todas las versiones lo llevan: con una etiqueta de version
# (`git tag -a v1.13.0 -m 1.13.0 && git push --tags`) se publica en ella como
# los demas, desde un trabajo aparte (`publish`, el unico que puede escribir;
# ver linux.yml).
name: macos

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Dos ejecuciones de la misma etiqueta no se pisan al publicar; las de una
# rama (workflow_dispatch) sí se cancelan: la nueva deja vieja a la otra.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      # que uno falle no tumba el otro: son procesadores distintos
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            # el .dmg se llama asi: dice para que Mac es (el de Tauri dice aarch64)
            dmg_name: apple-silicon
          - runner: macos-15-intel
            arch: x86_64
            dmg_name: intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `git tag v1.44.2` sobre un árbol en 1.44.1 publicaría en «v1.44.2»
      # paquetes que dicen 1.44.1
      - name: la etiqueta es la versión
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::la etiqueta es $GITHUB_REF_NAME y Cargo.toml dice $v"; exit 1; }

      # Bun (el gestor de paquetes de la interfaz) y Vite+ (vp), en las
      # versiones que fija desktop/package.json (packageManager y vite-plus).
      # setup-vp, a una versión exacta: su etiqueta v1 ya no se mueve.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: desktop/package.json
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          working-directory: desktop
          node-version: '24'
          # el Bun de arriba, no otro
          package-manager: false
          cache: true
          run-install: false

      # la de rust-toolchain.toml, la misma que en las pruebas
      - name: Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
      # v1: las cachés v0 son del perfil de antes (Cargo.toml) y, con la misma
      # clave, se restauraban sin servir y nunca se renovaban. Desde una
      # etiqueta no se guarda: esa caché no la restauraría nadie.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          prefix-key: v1-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Lo que se mete dentro, con version fija y su sha256 (las mismas que en
      # Linux y Windows), para el procesador de este Mac
      - name: ffmpeg, fpcalc, QuickJS y yt-dlp
        run: |
          ./scripts/tools-macos.sh
          ls -la desktop/src-tauri/tools

      # ONNX Runtime 1.31.0 en Apple Silicon; en Intel, la 1.23.2, la ultima
      # que hay para ellos (ver el script). La foto del catalogo de modelos,
      # la del repositorio (data/): la misma en todos los paquetes.
      - name: los datos y ONNX Runtime
        run: |
          ./scripts/data.sh
          ls -la desktop/src-tauri/data

      # Compilada sin empaquetar todavia: antes se prueba con ella el pulso
      # (abajo).
      - name: la app
        working-directory: desktop
        run: |
          vp install --frozen-lockfile
          vp exec tauri build --no-bundle

      # La propia app con un argumento, como la lanza el nucleo: el detector
      # de pulso con el grafo, ONNX Runtime y ffmpeg que viajan con ella.
      - name: el pulso de una canción, con su ONNX Runtime
        run: |
          tools=desktop/src-tauri/tools
          $tools/ffmpeg -loglevel error -f lavfi \
            -i "aevalsrc='0.8*sin(2*PI*1500*t)*lt(mod(t\,0.5)\,0.03)':s=44100:d=12" \
            -c:a libmp3lame clic.mp3
          out=$(DANPLAY_ONNXRUNTIME=desktop/src-tauri/data target/release/danplay-app \
            --pulse desktop/src-tauri/data/pulse/beat_this.onnx $tools/ffmpeg clic.mp3 crudo.json)
          echo "$out" | tail -1
          echo "$out" | tail -1 | grep -q '"ok": true'
          test -s crudo.json

      # Firma «ad hoc» (`-`) y sin «hardened runtime»: con el, macOS solo deja
      # cargar bibliotecas firmadas por el mismo equipo de desarrollo, y ONNX
      # Runtime (data/) y los programas de tools/ vienen firmados por otros:
      # no se cargarian.
      - name: paquete
        working-directory: desktop
        run: |
          vp exec tauri bundle --bundles app,dmg \
            --config '{"bundle":{"macOS":{"signingIdentity":"-","hardenedRuntime":false}}}'

      # con el nucleo, sus datos y sus programas, y sin nada de Python
      - name: qué lleva la .app
        run: |
          app=target/release/bundle/macos/DanPlay.app/Contents
          ls "$app"/Resources/data/libonnxruntime.*.dylib "$app"/Resources/data/pulse/beat_this.onnx \
             "$app"/Resources/data/models-snapshot.json "$app"/Resources/tools/ffmpeg \
             "$app"/Resources/tools/yt-dlp
          if find "$app" | grep -iE 'python|\.pyc|/_internal/'; then
            echo "la .app lleva algo de Python"; exit 1
          fi

      - name: la .app en un .zip
        run: |
          cd target/release/bundle/macos
          ditto -c -k --keepParent DanPlay.app "DanPlay-macos-${{ matrix.arch }}.zip"
          ls -la

      - name: el .dmg, con el nombre de las versiones
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          cd target/release/bundle/dmg
          mv DanPlay_*.dmg "DanPlay-$version-mac-${{ matrix.dmg_name }}.dmg"
          ls -la

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: danplay-macos-${{ matrix.arch }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.zip
          if-no-files-found: error

  # Lo único con permiso de escribir (ver linux.yml): los .dmg a la versión,
  # con su SHA256SUMS y su procedencia. Solo los .dmg: el .zip de la .app se
  # queda en el artefacto. Como antes, que falle un procesador no deja sin
  # publicar el del otro (por eso `!cancelled()` y no solo `needs`).
  publish:
    name: publicar en la versión
    needs: package
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # subir los archivos a la versión
      id-token: write       # firmar la procedencia
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: danplay-macos-*
          path: artifact
      - name: los paquetes y sus sumas
        run: |
          mkdir -p out
          find artifact -type f -name '*.dmg' -exec mv {} out/ \;
          ls out/*.dmg
          ( cd out && sha256sum -- * ) > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'out/*'
      # Los cuatro flujos de paquetes publican en la misma versión: el
      # primero que llega la crea y los demás suben a la que ya hay.
      - name: a la versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          repo=$GITHUB_REPOSITORY
          gh release view "$tag" -R "$repo" >/dev/null 2>&1 \
            || gh release create "$tag" -R "$repo" --verify-tag --title "$tag" --notes "" \
            || gh release view "$tag" -R "$repo" >/dev/null
          gh release upload "$tag" out/* SHA256SUMS-macos.txt -R "$repo" --clobber
