# Los paquetes de Linux (.deb y .AppImage), como hace `scripts/build.sh
# --package` en tu equipo pero en una maquina limpia.
#
# En Ubuntu 22.04 a proposito: lo que se compila contra una glibc nueva no
# arranca en una vieja, y al reves si. Asi el .AppImage funciona tambien en
# distribuciones de hace unos años.
#
# El nucleo va dentro de la app (el crate `server`); sus pruebas, en
# tests.yml.
#
# Con una etiqueta de version (`git tag -a v1.13.0 -m 1.13.0 && git push
# --tags`) los publica en esa version, junto a los de los demas sistemas.
# Publicar lo hace un trabajo aparte (`publish`), el unico con permiso de
# escribir: el que construye corre `vp install`, los build.rs y lo que se
# baja, y con ese permiso cualquiera de ellos podria tocar la version.
name: linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Dos ejecuciones de la misma etiqueta no se pisan al publicar; las de una
# rama (workflow_dispatch) sí se cancelan: la nueva deja vieja a la otra.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  packages:
    name: .deb y .AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `git tag v1.44.2` sobre un árbol en 1.44.1 publicaría en «v1.44.2»
      # paquetes que dicen 1.44.1
      - name: la etiqueta es la versión
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::la etiqueta es $GITHUB_REF_NAME y Cargo.toml dice $v"; exit 1; }

      # Bun (el gestor de paquetes de la interfaz) y Vite+ (vp), en las
      # versiones que fija desktop/package.json (packageManager y vite-plus).
      # setup-vp, a una versión exacta: su etiqueta v1 ya no se mueve.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: desktop/package.json
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          working-directory: desktop
          node-version: '24'
          # el Bun de arriba, no otro
          package-manager: false
          cache: true
          run-install: false

      # la de rust-toolchain.toml, la misma que en las pruebas
      - name: Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
      # v1: las cachés v0 son del perfil de antes (Cargo.toml) y, con la misma
      # clave, se restauraban sin servir y nunca se renovaban. Desde una
      # etiqueta no se guarda: esa caché no la restauraría nadie.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          prefix-key: v1-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: dependencias de Tauri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            patchelf libasound2-dev libdbus-1-dev libayatana-appindicator3-dev file

      # dentro de los paquetes: sin instalar nada aparte, y sin depender de
      # las bibliotecas de cada distribucion (ver los scripts)
      - name: ffmpeg, fpcalc, QuickJS y yt-dlp dentro
        run: ./scripts/tools-linux.sh

      # con la foto del catálogo de modelos del repositorio (data/), la que
      # se saca al subir la versión: la misma en todos los paquetes
      - name: los datos y ONNX Runtime dentro
        run: ./scripts/data.sh

      # Compilada sin empaquetar todavia: antes se prueba con ella el pulso
      # (abajo).
      - name: la app
        working-directory: desktop
        run: |
          vp install --frozen-lockfile
          vp exec tauri build --no-bundle

      # La propia app con un argumento, como la lanza el nucleo: el detector
      # de pulso con el grafo, ONNX Runtime y ffmpeg que viajan con ella, en
      # esta glibc vieja.
      - name: el pulso de una canción, con su ONNX Runtime
        run: |
          tools=desktop/src-tauri/tools
          $tools/ffmpeg -loglevel error -f lavfi \
            -i "aevalsrc='0.8*sin(2*PI*1500*t)*lt(mod(t\,0.5)\,0.03)':s=44100:d=12" \
            -c:a libmp3lame clic.mp3
          out=$(DANPLAY_ONNXRUNTIME=desktop/src-tauri/data target/release/danplay-app \
            --pulse desktop/src-tauri/data/pulse/beat_this.onnx $tools/ffmpeg clic.mp3 crudo.json)
          echo "$out" | tail -1
          echo "$out" | tail -1 | grep -q '"ok": true'
          test -s crudo.json

      - name: paquetes
        working-directory: desktop
        env:
          # linuxdeploy es a su vez un AppImage, y en la maquina de CI no hay FUSE
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: vp exec tauri bundle --bundles deb,appimage

      # Tauri lo deja en gzip; en xz pesa 21 MB menos (medido con la 1.44.1:
      # de 145 a 124), con el mismo contenido. xz y no zstd: el dpkg de
      # Debian 11 no abre zstd. Lo mismo que scripts/build.sh --package.
      - name: el .deb, en xz
        run: |
          deb=$(ls target/release/bundle/deb/*.deb)
          before=$(stat -c %s "$deb")
          rm -rf deb-raw
          dpkg-deb -R "$deb" deb-raw
          dpkg-deb -Zxz -z6 --root-owner-group -b deb-raw "$deb"
          rm -rf deb-raw
          echo "de $before a $(stat -c %s "$deb") bytes: $(ar t "$deb" | tr '\n' ' ')"

      # con el nucleo, sus datos y sus programas, y sin nada de Python
      - name: qué lleva el .deb
        run: |
          contents=$(dpkg-deb -c target/release/bundle/deb/*.deb)
          for wanted in usr/bin/danplay-app usr/lib/DanPlay/data/libonnxruntime.so \
                        usr/lib/DanPlay/data/pulse/beat_this.onnx usr/lib/DanPlay/data/models-snapshot.json \
                        usr/lib/DanPlay/tools/ffmpeg usr/lib/DanPlay/tools/fpcalc usr/lib/DanPlay/tools/qjs \
                        usr/lib/DanPlay/tools/yt-dlp; do
            echo "$contents" | grep -q "$wanted" || { echo "falta $wanted"; exit 1; }
          done
          if echo "$contents" | grep -iE 'python|\.pyc|/_internal/|libpython'; then
            echo "el .deb lleva algo de Python"; exit 1
          fi
          ar t target/release/bundle/deb/*.deb | grep -qx 'data.tar.xz' || { echo "el .deb no va en xz"; exit 1; }
          ls -la target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage

      # La ventana del paquete que se publica, abierta de verdad: el .deb
      # extraído, con una pantalla de mentira (Xvfb, que tests/smoke.sh usa
      # si está), y las comprobaciones de la prueba de humo (el núcleo
      # dentro, sus datos y programas, el pulso, la instancia única). Aún sin
      # ver en verde en la CI (¿arranca WebKitGTK bajo Xvfb sin retoques?):
      # hasta entonces un fallo aquí se ve pero no para la publicación.
      # Probarlo con workflow_dispatch y quitar `continue-on-error` al verlo
      # pasar.
      - name: el .deb abre su ventana (prueba de humo)
        continue-on-error: true
        env:
          # sin tarjeta gráfica: sin esto WebKitGTK intenta el modo acelerado
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        run: |
          sudo apt-get install -y xvfb
          rm -rf deb-ext
          dpkg-deb -x target/release/bundle/deb/*.deb deb-ext
          tests/smoke.sh "$PWD/deb-ext/usr/bin/danplay-app"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: danplay-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Lo único con permiso de escribir: sube los paquetes a la versión con su
  # SHA256SUMS y la procedencia firmada por GitHub (con qué flujo y qué
  # commit se construyeron), que se comprueba con
  #   gh attestation verify DanPlay_X_amd64.deb -R dani17r/danplay
  publish:
    name: publicar en la versión
    needs: packages
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # subir los archivos a la versión
      id-token: write       # firmar la procedencia
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: danplay-linux
          path: artifact
      - name: los paquetes y sus sumas
        run: |
          mkdir -p out
          find artifact -type f \( -name '*.deb' -o -name '*.AppImage' \) -exec mv {} out/ \;
          ls out/*.deb out/*.AppImage
          ( cd out && sha256sum -- * ) > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'out/*'
      # Los cuatro flujos de paquetes publican en la misma versión: el
      # primero que llega la crea y los demás suben a la que ya hay.
      - name: a la versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          repo=$GITHUB_REPOSITORY
          gh release view "$tag" -R "$repo" >/dev/null 2>&1 \
            || gh release create "$tag" -R "$repo" --verify-tag --title "$tag" --notes "" \
            || gh release view "$tag" -R "$repo" >/dev/null
          gh release upload "$tag" out/* SHA256SUMS-linux.txt -R "$repo" --clobber
