# Los paquetes de Linux (.deb y .AppImage), como hace `scripts/build.sh
# --package` en tu equipo pero en una maquina limpia.
#
# En Ubuntu 22.04 a proposito: lo que se compila contra una glibc nueva no
# arranca en una vieja, y al reves si. Asi el .AppImage funciona tambien en
# distribuciones de hace unos años.
#
# Sin Python: el nucleo va dentro de la app (el crate `server`). Las pruebas
# del nucleo de Python, solo en tests.yml.
#
# Con una etiqueta de version (`git tag v1.13.0 && git push --tags`) los
# publica en esa version, junto al instalador de Windows (`windows.yml`).
name: linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write     # publicar los paquetes en la version

jobs:
  packages:
    name: .deb y .AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # Bun (el gestor de paquetes de la interfaz) y Vite+ (vp), en las
      # versiones que fija desktop/package.json (packageManager y vite-plus).
      # setup-vp, a una versión exacta: su etiqueta v1 ya no se mueve.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: desktop/package.json
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          working-directory: desktop
          node-version: '24'
          # el Bun de arriba, no otro
          package-manager: false
          cache: true
          run-install: false

      - uses: dtolnay/rust-toolchain@stable
      # v1: las cachés v0 son del perfil de antes (Cargo.toml) y, con la misma
      # clave, se restauraban sin servir y nunca se renovaban
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: v1-rust

      - name: dependencias de Tauri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            patchelf libasound2-dev libdbus-1-dev libayatana-appindicator3-dev file

      # dentro de los paquetes: sin instalar nada aparte, y sin depender de
      # las bibliotecas de cada distribucion (ver los scripts)
      - name: ffmpeg, fpcalc, QuickJS y yt-dlp dentro
        run: ./scripts/tools-linux.sh

      - name: los datos y ONNX Runtime dentro
        run: ./scripts/data.sh

      # Compilada sin empaquetar todavia: antes se saca con ella la foto del
      # catalogo de modelos de IA (abajo).
      - name: la app
        working-directory: desktop
        run: |
          vp install --frozen-lockfile
          vp exec tauri build --no-bundle

      # la de hoy (lo que hacia scripts/update-models.py); sin red, la que hay
      - name: la foto del catálogo de modelos
        run: target/release/danplay-app --models-snapshot desktop/src-tauri/data/models-snapshot.json || true

      # La propia app con un argumento, como la lanza el nucleo: el detector
      # de pulso con el grafo, ONNX Runtime y ffmpeg que viajan con ella, en
      # esta glibc vieja.
      - name: el pulso de una canción, con su ONNX Runtime
        run: |
          tools=desktop/src-tauri/tools
          $tools/ffmpeg -loglevel error -f lavfi \
            -i "aevalsrc='0.8*sin(2*PI*1500*t)*lt(mod(t\,0.5)\,0.03)':s=44100:d=12" \
            -c:a libmp3lame clic.mp3
          out=$(DANPLAY_ONNXRUNTIME=desktop/src-tauri/data target/release/danplay-app \
            --pulse desktop/src-tauri/data/pulse/beat_this.onnx $tools/ffmpeg clic.mp3 crudo.json)
          echo "$out" | tail -1
          echo "$out" | tail -1 | grep -q '"ok": true'
          test -s crudo.json

      - name: paquetes
        working-directory: desktop
        env:
          # linuxdeploy es a su vez un AppImage, y en la maquina de CI no hay FUSE
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: vp exec tauri bundle --bundles deb,appimage

      # con el nucleo, sus datos y sus programas, y sin nada de Python
      - name: qué lleva el .deb
        run: |
          contents=$(dpkg-deb -c target/release/bundle/deb/*.deb)
          for wanted in usr/bin/danplay-app usr/lib/DanPlay/data/libonnxruntime.so \
                        usr/lib/DanPlay/data/pulse/beat_this.onnx usr/lib/DanPlay/tools/yt-dlp; do
            echo "$contents" | grep -q "$wanted" || { echo "falta $wanted"; exit 1; }
          done
          if echo "$contents" | grep -iE 'python|\.pyc|/_internal/|libpython'; then
            echo "el .deb lleva algo de Python"; exit 1
          fi
          ls -la target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: danplay-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: publicar en la versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
