# Los paquetes de Linux (.deb y .AppImage), como hace `scripts/build.sh
# --package` en tu equipo pero en una maquina limpia.
#
# En Ubuntu 22.04 a proposito: lo que se compila contra una glibc nueva no
# arranca en una vieja, y al reves si. Asi el .AppImage y el nucleo
# empaquetado funcionan tambien en distribuciones de hace unos años.
#
# Con una etiqueta de version (`git tag v1.13.0 && git push --tags`) los
# publica en esa version, junto al instalador de Windows (`windows.yml`).
name: linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write     # publicar los paquetes en la version

jobs:
  paquetes:
    name: .deb y .AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      # v1: las cachés v0 son del perfil de antes (Cargo.toml) y, con la misma
      # clave, se restauraban sin servir y nunca se renovaban
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust

      - name: dependencias de Tauri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            patchelf libasound2-dev libdbus-1-dev libayatana-appindicator3-dev file

      - name: núcleo empaquetado
        run: |
          python -m pip install --upgrade pip
          # con hashes (salen de uv.lock); PyInstaller aparte, que en una orden
          # con hashes no se puede mezclar uno sin ellos
          pip install -r requirements.txt
          pip install "$(grep -i '^pyinstaller==' requirements-dev.txt)"
          # el crate de Rust del nucleo (las etiquetas, con lofty): se compila
          # aqui, con maturin, y el nucleo empaquetado lo lleva dentro
          pip install ./core
          # la foto del catalogo de modelos de IA, la de hoy (sin red se queda la que hay)
          python scripts/actualizar-modelos.py || true
          pyinstaller --noconfirm --clean --distpath dist/core packaging/core.spec
          test -x dist/core/danplay-core/danplay-core
          # con el crate de Rust y sin mutagen, que es GPL (ver core.spec)
          test -d dist/core/danplay-core/_internal/danplay_core
          test ! -e dist/core/danplay-core/_internal/mutagen
          # y la biblioteca de ONNX Runtime que carga el pulso desde Rust
          ls dist/core/danplay-core/_internal/onnxruntime/capi/libonnxruntime.so.*

      - name: el núcleo arranca y responde
        run: |
          sock=$(mktemp -u)
          dist/core/danplay-core/danplay-core --uds "$sock" &
          pid=$!
          for i in $(seq 1 30); do
            curl -sf --unix-socket "$sock" http://x/api/status > /dev/null && break
            sleep 1
          done
          curl -sf --unix-socket "$sock" http://x/api/status > /dev/null
          kill $pid

      # una carpeta (onedir) entre los recursos de Tauri, core/: asi no se
      # descomprime en cada arranque (ver packaging/core.spec)
      - name: el núcleo, junto a la app
        run: cp -a dist/core/danplay-core/. desktop/src-tauri/core/

      # dentro de los paquetes: sin instalar nada aparte, y sin depender de
      # las bibliotecas de cada distribucion (ver el script)
      - name: ffmpeg, fpcalc y QuickJS dentro
        run: ./scripts/herramientas-linux.sh

      - name: paquetes
        working-directory: desktop
        env:
          # linuxdeploy es a su vez un AppImage, y en la maquina de CI no hay FUSE
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          npm ci
          npx tauri build --bundles deb,appimage

      - uses: actions/upload-artifact@v7
        with:
          name: danplay-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: publicar en la versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
