# Las pruebas en cada push y en cada pull request.
#
# La biblioteca de prueba se genera con ffmpeg, así que aquí se comprueba lo
# mismo que en tu equipo. Hasta septiembre de 2026 este flujo no había pasado
# nunca: el trabajo de escritorio necesitaba el núcleo empaquetado (que no está
# en git) y el de Windows exigía el crate de Rust sin compilarlo.
name: pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la misma rama deja obsoleto el anterior: no se gasta en él.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: núcleo Python y crate de Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv no publica etiquetas de versión mayor (v10): solo completas.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: '3.13'
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # v1: las cachés v0 son del perfil de antes (Cargo.toml) y, con la misma
      # clave, se restauraban sin servir y nunca se renovaban
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: v1-rust
      # ffmpeg, fpcalc y QuickJS fijos (con su sha256), los mismos que viajan
      # en los paquetes, en vez de apt: un día apt tardó 20 minutos en
      # instalar ffmpeg. Guardados en la caché: la segunda vez no se baja nada.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/danplay-linux
          key: tools-linux-${{ hashFiles('scripts/tools-linux.sh') }}
      - name: programas del sistema
        run: |
          ./scripts/tools-linux.sh
          echo "$PWD/desktop/src-tauri/tools" >> "$GITHUB_PATH"
      # --locked: si uv.lock no cuadra con pyproject.toml, falla en vez de
      # resolver otra cosa. Compila el crate de Rust (editable) con maturin.
      - name: dependencias
        run: uv sync --locked
      - name: los requirements*.txt salen del cerrojo
        run: uv run python scripts/export-requirements.py --check
      - name: estilo (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: tipos (basedpyright, solo errores nuevos)
        run: uv run basedpyright
      # repartidas entre los núcleos de la máquina (pytest-xdist)
      - name: pruebas del núcleo, con cobertura
        run: uv run pytest -n auto --dist loadgroup
      # Sin `extension-module` en Cargo.toml, las pruebas enlazarian con
      # libpython; con esto se compilan como la extension que hace maturin.
      - name: estilo del crate
        env:
          PYO3_BUILD_EXTENSION_MODULE: '1'
        run: cargo clippy -p danplay_core -p danplay-library -p danplay-analysis --all-targets -- -D warnings
      # danplay-library: las etiquetas en Rust (lofty), que usa el crate;
      # danplay-analysis: el pulso, el clic y los pesos de los modelos
      - name: pruebas del crate
        env:
          PYO3_BUILD_EXTENSION_MODULE: '1'
        run: cargo test --release -p danplay_core -p danplay-library -p danplay-analysis

  # El núcleo, en Windows. Es la única forma de saber si de verdad funciona
  # allí: las rutas, la papelera y el transporte por loopback con token toman
  # caminos distintos que en Linux no se ejecutan nunca. Con el crate de Rust,
  # que el núcleo necesita (las etiquetas, los nombres...), compilado aquí.
  core-windows:
    name: núcleo Python en Windows (${{ matrix.shard }}/2)
    runs-on: windows-latest
    # las pruebas, repartidas entre dos máquinas a la vez (DANPLAY_SHARD:
    # por archivos y por lo que tarda cada uno, ver tests/conftest.py)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      # v1: las cachés v0 son del perfil de antes (Cargo.toml) y, con la misma
      # clave, se restauraban sin servir y nunca se renovaban
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: v1-rust
      - name: ffmpeg (para generar la biblioteca de prueba)
        run: choco install ffmpeg --no-progress -y
      - name: dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt
          # el crate de Rust del núcleo, compilado con maturin
          pip install ./core
      # media suite en cada máquina, repartida entre sus núcleos (en serie
      # eran más de 7 minutos); las de test_api.py, en el mismo proceso. Sin
      # cobertura: con media suite no llegaría al mínimo; se mide en Linux.
      - name: pruebas
        env:
          DANPLAY_SHARD: ${{ matrix.shard }}/2
        run: pytest -n auto --dist loadgroup --no-cov --durations=0 --durations-min=0.3
      - name: la línea de órdenes arranca
        run: python -m danplay.cli status

  frontend:
    name: interfaz
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      # Bun (el gestor de paquetes de la interfaz) y Vite+ (vp), en las
      # versiones que fija desktop/package.json (packageManager y vite-plus).
      # setup-vp, a una versión exacta: su etiqueta v1 ya no se mueve.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: desktop/package.json
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          working-directory: desktop
          node-version: '24'
          # el Bun de arriba, no otro
          package-manager: false
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: estilo y formato
        run: vp run lint && vp run lint:css && vp run format:check
      - name: tipos
        run: vp run typecheck
      - name: los iconos están al día
        run: node scripts/icons.mjs --check
      - name: pruebas, con cobertura
        run: vp run test:coverage
      - name: compila
        run: vp build
      - name: rutas de medios
        working-directory: .
        run: node tests/test_frontend.mjs

  # La interfaz de verdad contra el núcleo de verdad, en Chrome (viene en la
  # imagen de Ubuntu de GitHub): lo que las pruebas con dobles no ven.
  e2e:
    name: interfaz y núcleo juntos (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      # el núcleo ya no arranca sin su crate de Rust (danplay_core): se
      # compila aquí con maturin, como en los paquetes
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: v1-rust
      # Bun (el gestor de paquetes de la interfaz) y Vite+ (vp), en las
      # versiones que fija desktop/package.json (packageManager y vite-plus).
      # setup-vp, a una versión exacta: su etiqueta v1 ya no se mueve.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: desktop/package.json
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          working-directory: desktop
          node-version: '24'
          # el Bun de arriba, no otro
          package-manager: false
          cache: true
          run-install: false
      # ffmpeg, fpcalc y QuickJS fijos (con su sha256), los mismos que viajan
      # en los paquetes, en vez de apt: un día apt tardó 20 minutos en
      # instalar ffmpeg. Guardados en la caché: la segunda vez no se baja nada.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/danplay-linux
          key: tools-linux-${{ hashFiles('scripts/tools-linux.sh') }}
      - name: programas del sistema
        run: |
          ./scripts/tools-linux.sh
          echo "$PWD/desktop/src-tauri/tools" >> "$GITHUB_PATH"
      - name: dependencias
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install ./core
          cd desktop && vp install --frozen-lockfile
      - name: flujos completos
        working-directory: desktop
        run: vp run e2e
      - name: informe si algo falló
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: desktop/playwright-report
          if-no-files-found: ignore

  desktop:
    name: envoltorio de escritorio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-gnu
      # v1: las cachés v0 son del perfil de antes (Cargo.toml) y, con la misma
      # clave, se restauraban sin servir y nunca se renovaban
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: v1-rust
      # Bun (el gestor de paquetes de la interfaz) y Vite+ (vp), en las
      # versiones que fija desktop/package.json (packageManager y vite-plus).
      # setup-vp, a una versión exacta: su etiqueta v1 ya no se mueve.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: desktop/package.json
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          working-directory: desktop
          node-version: '24'
          # el Bun de arriba, no otro
          package-manager: false
          cache: true
          run-install: false
      - name: dependencias de Tauri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev patchelf libasound2-dev libdbus-1-dev \
            ffmpeg mingw-w64
      # Tauri exige la interfaz compilada para compilar, y no está en git (los
      # datos y las herramientas no: van entre los recursos, y sin ellos
      # bastan sus LEEME)
      - name: interfaz
        working-directory: desktop
        run: |
          vp install --frozen-lockfile
          vp build
          vp build --mode mobile
      - name: estilo
        run: |
          cargo fmt --all --check
          cargo clippy -p danplay-app --all-targets -- -D warnings
          cargo clippy -p danplay-engine --all-targets -- -D warnings
          cargo clippy -p danplay-mobile --all-targets -- -D warnings
      # Algunas usan ffmpeg de verdad (opus, cambiar el tono); las de sonido
      # se saltan solas y lo dicen, porque la maquina de CI no tiene salida.
      - name: pruebas del reproductor, la cola y la bandeja
        run: cargo test --release -p danplay-app
      # El motor de la app del celular, en Linux: lo mismo que corre en el
      # telefono, sin la salida de audio (las pruebas tiran del render a mano).
      - name: pruebas del motor y de la app del celular
        run: cargo test --release -p danplay-engine -p danplay-mobile
      # El código solo-Windows (Job Object, registro, consola) no se compila
      # nunca en Linux: comprobarlo aquí caza lo que se rompe sin ver Windows.
      # Con el destino gnu, porque Tauri compila los recursos de Windows y
      # desde Linux solo hay con qué hacerlo con mingw (windres).
      - name: el código de Windows compila
        run: |
          cargo check -p danplay-app --target x86_64-pc-windows-gnu

  audit:
    name: avisos de seguridad de las dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Rust
        run: |
          cargo audit
      # lee bun.lock: no hace falta instalar nada
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: desktop/package.json
      # Solo lo que va dentro de la app. Las herramientas de desarrollo
      # (stylelint, vite...) solo leen nuestro propio codigo, y un aviso sin
      # arreglo en una de ellas (braces, en 2026-09) dejaba esto en rojo
      # sin nada que hacer
      - name: interfaz
        working-directory: desktop
        run: bun audit --prod --audit-level=moderate
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Python
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
