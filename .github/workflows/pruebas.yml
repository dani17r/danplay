# Las pruebas en cada push y en cada pull request.
#
# La biblioteca de prueba se genera con ffmpeg, así que aquí se comprueba lo
# mismo que en tu equipo. Hasta septiembre de 2026 este flujo no había pasado
# nunca: el trabajo de escritorio necesitaba el núcleo empaquetado (que no está
# en git) y el de Windows exigía el crate de Rust sin compilarlo.
name: pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la misma rama deja obsoleto el anterior: no se gasta en él.
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nucleo:
    name: núcleo Python y crate de Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv no publica etiquetas de versión mayor (v10): solo completas.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.13'
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: programas del sistema
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg libchromaprint-tools
      # --locked: si uv.lock no cuadra con pyproject.toml, falla en vez de
      # resolver otra cosa. Compila el crate de Rust (editable) con maturin.
      - name: dependencias
        run: uv sync --locked
      - name: los requirements*.txt salen del cerrojo
        run: uv run python scripts/exportar-requisitos.py --check
      - name: estilo (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: tipos (basedpyright, solo errores nuevos)
        run: uv run basedpyright
      - name: pruebas del núcleo, con cobertura
        run: uv run pytest
      # Sin `extension-module` en Cargo.toml, las pruebas enlazarian con
      # libpython; con esto se compilan como la extension que hace maturin.
      - name: estilo del crate
        env:
          PYO3_BUILD_EXTENSION_MODULE: '1'
        run: cargo clippy -p danplay_core --all-targets -- -D warnings
      - name: pruebas del crate
        env:
          PYO3_BUILD_EXTENSION_MODULE: '1'
        run: cargo test --release -p danplay_core

  # El núcleo, en Windows. Es la única forma de saber si de verdad funciona
  # allí: las rutas, la papelera y el transporte por loopback con token toman
  # caminos distintos que en Linux no se ejecutan nunca. Sin el crate de Rust,
  # como viaja en el instalador de Windows.
  nucleo-windows:
    name: núcleo Python en Windows
    runs-on: windows-latest
    env:
      DANPLAY_SIN_RUST: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: ffmpeg (para generar la biblioteca de prueba)
        run: choco install ffmpeg --no-progress -y
      - name: dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt
      - name: pruebas
        run: pytest
      - name: la línea de órdenes arranca
        run: python -m danplay.cli status

  interfaz:
    name: interfaz
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: estilo y formato
        run: npm run lint && npm run lint:css && npm run format:check
      - name: tipos
        run: npm run typecheck
      - name: los iconos están al día
        run: node scripts/icons.mjs --check
      - name: pruebas, con cobertura
        run: npm run test:coverage
      - name: compila
        run: npx vite build
      - name: rutas de medios
        working-directory: .
        run: node tests/test_frontend.mjs

  # La interfaz de verdad contra el núcleo de verdad, en Chrome (viene en la
  # imagen de Ubuntu de GitHub): lo que las pruebas con dobles no ven.
  e2e:
    name: interfaz y núcleo juntos (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: programas del sistema
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: dependencias
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          cd desktop && npm ci
      - name: flujos completos
        working-directory: desktop
        run: npm run e2e
      - name: informe si algo falló
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-informe
          path: desktop/playwright-report
          if-no-files-found: ignore

  escritorio:
    name: envoltorio de escritorio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: dependencias de Tauri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev patchelf libasound2-dev libdbus-1-dev \
            ffmpeg mingw-w64
      # Tauri exige el núcleo empaquetado y la interfaz compilada para
      # compilar, y ninguno de los dos está en git: uno de relleno (la app lo
      # reconoce y no lo usa) y la interfaz de verdad.
      - name: núcleo de relleno e interfaz
        working-directory: desktop
        run: |
          npm ci
          node scripts/sidecar.mjs
          npx vite build
      - name: estilo
        run: |
          cargo fmt --all --check
          cargo clippy -p danplay-app --all-targets -- -D warnings
      # Algunas usan ffmpeg de verdad (opus, cambiar el tono); las de sonido
      # se saltan solas y lo dicen, porque la maquina de CI no tiene salida.
      - name: pruebas del reproductor, la cola y la bandeja
        run: cargo test --release -p danplay-app
      # El código solo-Windows (Job Object, registro, consola) no se compila
      # nunca en Linux: comprobarlo aquí caza lo que se rompe sin ver Windows.
      # Con el destino gnu, porque Tauri compila los recursos de Windows y
      # desde Linux solo hay con qué hacerlo con mingw (windres).
      - name: el código de Windows compila
        run: |
          node desktop/scripts/sidecar.mjs x86_64-pc-windows-gnu
          cargo check -p danplay-app --target x86_64-pc-windows-gnu

  auditoria:
    name: avisos de seguridad de las dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Rust
        run: |
          cargo audit
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: npm
        working-directory: desktop
        run: npm audit --audit-level=moderate
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Python
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
