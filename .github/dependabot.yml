# Dependabot abre un pull request cuando sale una version nueva de algo que usa
# DanPlay. Semanal y agrupado: un PR por ecosistema con todos los parches y
# versiones menores, y uno aparte por cada salto de version mayor (esos pueden
# romper y hay que mirarlos uno a uno). Las pruebas de `tests.yml` corren en
# cada PR, asi que se ve al momento si algo se rompe.
version: 2

updates:
  # el nucleo (pyproject.toml + uv.lock; los requirements*.txt salen del lock)
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]
    ignore:
      # La 0.142 solo trae OpenTelemetry automatico (y una dependencia mas),
      # que una app local no usa: se queda en la 0.141. La 0.143 si se propone
      - dependency-name: fastapi
        versions: ['>=0.142, <0.143']
      # va fijada por pydantic: subirla sola nunca resuelve (PR #3)
      - dependency-name: pydantic-core

  # la interfaz: Bun (desktop/package.json + bun.lock)
  - package-ecosystem: bun
    directory: /desktop
    schedule:
      interval: weekly
    # Nada con menos de dos semanas, lo mismo que pide desktop/bunfig.toml
    # (minimumReleaseAge): Bun no instalaria lo que proponga antes
    cooldown:
      default-days: 14
    groups:
      frontend:
        update-types: [minor, patch]
        exclude-patterns: [vite-plus]
    ignore:
      # vue-tsc (`vp run typecheck`) no arranca con TypeScript 7: carga
      # typescript/lib/tsc, que la 7 ya no exporta. Quitar cuando vue-tsc la admita
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Van con Vite+ y se suben con el, todos a la vez: `vite` es un alias de
      # su nucleo, y `vitest` y su cobertura, la version que trae dentro (ver
      # las `overrides`). Cuando llegue el PR de `vite-plus`, `vp migrate` en
      # desktop/ los pone al dia juntos.
      - dependency-name: vite
      - dependency-name: vitest
      - dependency-name: '@vitest/*'

  # un solo workspace (Cargo.toml y Cargo.lock en la raiz): con los dos crates
  # por separado, Dependabot no podia cargar el workspace y no proponia nada
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
